<!doctype html>
<html lang="en" class="dark h-full">
  <head>
    <meta charset="UTF-8" />
    <!-- `viewport-fit=cover` lets the board paint under a notch, a punch-hole
         camera or a home indicator. The canvas wants every pixel and dark grey
         behind a cutout reads as bezel; the chrome layer holds itself clear
         with `env(safe-area-inset-*)` instead. Installed as a PWA there is no
         browser UI to hide behind, so without this the top-left island sits
         under the status bar (D68). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- The standardised standalone flag, and deliberately the only one.
         Apple's own spelling of it is not declared: it opts the app into
         Apple's legacy standalone path, where the web view is shifted up under
         the status bar without being made any taller, and the band it vacates
         at the bottom of the screen is clipped away — a 402x812 window on a
         402x874 phone, measured (D106). Left to the manifest's
         `display: standalone`, iOS 16.4 and later give the page the whole
         screen, and the insets describe the parts of it that are spoken for.
         -->
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- The colour behind the status bar glyphs, which the manifest's
         `theme_color` also carries; declared here as well so it applies before
         the manifest is fetched. The board's own near-black, so the bar is not
         a band. -->
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="CanWas is an infinite board for images and text. Paste a screenshot, arrange it, and read the text back out of it."
    />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="canonical" href="https://hikarintu.github.io/canwas/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Noto Sans covers the Latin UI, Noto Sans TC the zh-TW translations, so
         both scripts render in the same design rather than falling back to
         whatever the system supplies. Only weight 700 is loaded. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@700&family=Noto+Sans+TC:wght@700&display=swap"
      rel="stylesheet"
    />
    <!-- Material Symbols is a variable font whose `wght` axis is a real weight
         axis, so 700 thickens the strokes rather than scaling the glyph.
         `display=block` matters here: an icon font renders its ligature text
         until it loads, so with `swap` the chrome would briefly read
         "menu undo redo" in words. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,700,0,0&display=block"
      rel="stylesheet"
    />
    <title>CanWas</title>
  </head>
  <!-- The page's own ground, in the markup rather than in a `body` rule: the
       stylesheet keeps only what has no element to live on. `overscroll-none`
       stops the rubber-band that would otherwise drag the whole page while the
       canvas is being panned. -->
  <body
    class="h-full overscroll-none bg-neutral-950 font-[Noto_Sans,Noto_Sans_TC,ui-sans-serif,system-ui,-apple-system,sans-serif] font-bold text-neutral-100"
  >
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
